services:
  # PostgreSQL Database
  postgres:
    image: postgres:15
    container_name: auth_postgres
    environment:
      POSTGRES_USER: ${PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD}
      POSTGRES_DB: ${PGDATABASE}
    ports:
      - "${PGPORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      
  nest-app:
    build: .
    restart: always
    depends_on:
      - postgres
    env_file:
      - .env
    environment:
      - PGHOST=postgres  # <-- Changed from 'auth_postgres' to 'postgres'
    ports:
      - "${PORT}:${PORT}"
      
volumes:
  postgres_data: